[pytest]
# 测试报告配置 — LiteReport（单 HTML 文件，零 JDK，离线可用）
# 报告输出: reports/report.html
# 截图: output/screenshots/
addopts =
    --litereport

# playwright-healer 自愈参数（全局默认启用）
# --ph-strategy=SMART           四级自愈策略: heuristic -> DOM fuzzy -> AI DOM -> AI visual
# --ph-auto-patch-source        自愈后自动回写选择器到源码文件
# --ph-ai-patch-source          使用 AI 智能重写源码（处理 role selector、变量等复杂场景）


